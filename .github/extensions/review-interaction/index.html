<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1 id="review-heading">Review</h1>
    <section class="graph-section" aria-labelledby="review-heading">
      <div class="graph-frame">
        <div id="graph">
          <svg id="edges" aria-hidden="true">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z"></path>
              </marker>
              <marker id="arrow-ready" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z"></path>
              </marker>
            </defs>
            <g id="edge-layer"></g>
          </svg>
        </div>
        <button id="add" type="button" class="icon" title="Add reviewer" aria-label="Add reviewer">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
        </button>
      </div>

      <div class="graph-controls">
        <div class="buttons">
          <label class="inline">Preset <select id="preset"></select></label>
          <button id="save" type="button">Save</button>
          <button id="save-as" type="button">Save as...</button>
        </div>
        <div class="buttons run-controls">
          <button id="stop" type="button" hidden>Stop</button>
          <button id="run" type="button" class="primary" disabled>Run review</button>
        </div>
      </div>
      <p id="status" role="status" aria-live="polite">Connecting...</p>
      <p id="request" class="muted" hidden></p>
      <p id="run-error" class="error" hidden></p>
      <p id="error" class="error" role="alert" hidden></p>

      <div id="inspector" hidden>
        <label>Name <input id="node-name"></label>
        <label>Model <select id="node-model"></select></label>
        <label>Effort <select id="node-effort"></select></label>
        <p id="effort-hint" class="muted hint" hidden></p>
        <label class="prompt-field">Prompt file
          <input id="node-prompt" list="prompt-files" spellcheck="false" placeholder="C:\reviews\design.md">
        </label>
        <datalist id="prompt-files"></datalist>
        <p id="prompt-missing" class="error hint" hidden>This prompt file doesn't exist.</p>
        <p id="prompt-hint" class="muted hint"></p>
        <button id="remove" type="button" class="danger">Remove reviewer</button>
      </div>
    </section>

    <section aria-labelledby="comments-heading">
      <h2 id="comments-heading">Comments <span id="comment-count" class="muted"></span></h2>
      <p id="no-comments" class="muted">No comments yet.</p>
      <ol id="comments"></ol>
    </section>
  </main>

  <dialog id="save-as-dialog" aria-labelledby="save-as-heading">
    <form method="dialog">
      <h3 id="save-as-heading">Save preset as</h3>
      <label>Name <input id="save-as-name" required autocomplete="off"></label>
      <div class="buttons">
        <button value="save" class="primary">Save</button>
        <button value="cancel" formnovalidate>Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" aria-labelledby="confirm-message">
    <form method="dialog">
      <p id="confirm-message"></p>
      <div id="confirm-buttons" class="buttons"></div>
    </form>
  </dialog>

  <template id="pencil-icon">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13l.8-3.2L10.6 3a1.4 1.4 0 0 1 2 0l.4.4a1.4 1.4 0 0 1 0 2L6.2 12.2 3 13zM9.5 4.1l2.4 2.4"></path></svg>
  </template>
</body>
</html>
