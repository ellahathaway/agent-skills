<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Review</h1>
    <p class="muted">A review subagent checks README.md. The main agent receives the result when the review stops.</p>
    <div id="review-status" class="review-status" aria-busy="false">
      <span id="spinner" class="spinner" aria-hidden="true" hidden></span>
      <svg id="checkmark" class="checkmark" aria-hidden="true" viewBox="0 0 24 24" hidden>
        <path d="M5 12l4 4L19 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <p id="status" role="status" aria-live="polite">Connecting...</p>
        <p id="handoff" class="muted" hidden></p>
      </div>
    </div>
    <button id="start" type="button" disabled>Start review</button>
    <p id="error" role="alert" hidden></p>
    <section id="result" hidden>
      <h2>Review result</h2>
      <p id="summary"></p>
    </section>
  </main>
</body>
</html>
